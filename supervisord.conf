[supervisord]
nodaemon = true
user = root
pidfile = /var/run/supervisord.pid

[program:server]
autostart = true
autorestart = true
stopwaitsecs = 8
startsecs = 3
command = python backend/server.py
stopsignal=INT
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
redirect_stderr = true

[program:grabber]
autostart = true
autorestart = true
stopwaitsecs = 8
startsecs = 3
command = python backend/grabber.py
stopsignal=TERM
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
redirect_stderr = true

# When grabber or server exits, the listener SIGTERMs PID 1 so Docker restarts the
# container. per-program autorestart=true still respawns briefly, but the listener
# tears the container down — crash recovery is via Docker restart policy.
[eventlistener:processes]
command=bash -c "printf 'READY\n' && while read -r line; do kill -s SIGTERM 1; exit 1; done < /dev/stdin"
events=PROCESS_STATE_STOPPED,PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
