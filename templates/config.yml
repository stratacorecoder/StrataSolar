## User Settings

# Logging configuration: normal or verbose.
logging: verbose

# Sets the local time zone (use "Asia/Manila" for this Bataan site).
# POSIX TZ strings are supported; note that POSIX signs are inverted relative to
# UTC (e.g. "GMT+8" means UTC-8). Whitespace around the value is trimmed.
time_zone: "Asia/Manila"

# PV data grabber configuration
# Currently the following devices are available
#  - Dummy: a simple dummy devices that can be used for testing
#  - Fronius: supports Fronius Symo/GEN24 inverters + smar meter
#  - Sunsynk: supports Sunsynk/Deye single-phase hybrid inverters via the
#             WiFi/LAN data logger (Solarman V5 protocol, local, no cloud)
device:
  type:        Dummy       # Name of the device to load (must match an existing device .py file/class)
  start_date:  2020-08-01  # The start of operation (YYYY-MM-DD)

# Device specific settings. These depend on the selected device adapter
# Enable if you want to use Fronius hardware
#fronius:
#  host_name: 192.168.178.200  # Host name/IP address of the Fronius end point
#  has_meter: False # Is smart meter present?

# Enable if you want to use Sunsynk/Deye hardware (set device.type to Sunsynk)
# Choose one transport via "connection": solarman (WiFi/LAN dongle) or modbus_rtu (RS485).
#sunsynk:
#  connection:    solarman         # solarman | modbus_rtu
#  mb_slave_id:   1                # Modbus slave/unit id (default 1)
#  # --- connection: solarman (WiFi/LAN data logger) ---
#  host_name:     192.168.178.201  # IP address of the Sunsynk WiFi/LAN logger (dongle)
#  logger_serial: 1234567890       # Serial number of the data logger (printed on the dongle)
#  port:          8899             # Solarman V5 TCP port (default 8899)
#  # --- connection: modbus_rtu (USB-RS485 adapter on the inverter's 485 port) ---
#  # serial_port: /dev/ttyUSB0     # Host serial device (pass into the container via docker "devices:")
#  # baudrate:    9600             # Serial baud rate (Sunsynk default 9600)
#  # parity:      N                # N | E | O
#  # stopbits:    1
#  # bytesize:    8

# Electricity prices. Used to calculate earnings in the UI.
prices:
  price_per_grid_kwh:     0.325  # Price for 1 kWh from the grid in Euro
  revenue_per_fed_in_kwh: 0.085  # Revenue for one fed in kWh in Euro

# General StrataSolar Config
stratasolar:
  name: "My Site" # Name of the StrataSolar instance

# Single-site forecast, tuned and replay-tested for Bataan (near Balanga City).
# Coordinates remain configurable. Set capacity to the installed array rating.
# Open-Meteo failures use history and never stop recording.
forecast:
  enabled: true
  latitude: 14.68
  longitude: 120.54
  panel_capacity_kw: 8.0
  panel_tilt_deg: 15
  panel_azimuth_deg: 180   # compass degrees: south (Open-Meteo receives 0)
#  system_loss_factor: 0.85
#  min_history_days: 3
#  forecast_days: 7
#  refresh_interval_s: 3600

# Optional: operational alerts (persisted in SQLite; shown in the UI).
#alerts:
#  enabled: true
#  device_stale_multiplier: 6
#  zero_production_minutes: 45
#  below_forecast_fraction: 0.35
#  consumption_spike_enabled: false  # usage information, not an equipment fault
#  production_underperformance_minutes: 30
#  production_weather_min_fraction: 0.15  # forecast kW / installed PV kW
#  equipment_open_minutes: 5
#  panels_mppt_capacity_kw: [4.0, 4.0]  # only comparable, equally oriented strings
#  panels_mppt_minutes: 15
#  battery_capacity_kwh: 10.0          # actual usable capacity; enables SOC/power check
#  battery_soc_jump_minutes: 2
#  battery_charge_stalled_enabled: false  # opt in only when PV charging is expected
#  battery_charge_stalled_minutes: 30
#  device_unreachable_night_suppress: true
#  device_unreachable_quiet_start_hour: 22   # must set both quiet hours together
#  device_unreachable_quiet_end_hour: 6

# Optional: Dummy device fault_mode hooks: offline | zero_daylight | stale |
# battery_stuck | inverter_dc_without_ac | panels_mppt_imbalance |
# battery_fault | battery_soc_jump | battery_charge_stalled.
#dummy:
#  fault_mode: ""
#  battery_soc_percent: 85
  
## Internal Settings. Do not modify!

# Web server configuration. Do not modify!
server:
  ip:     0.0.0.0       # IP address of the server, usually 0.0.0.0 should work
  port:   5000          # Port for the web server (default)

# Data grabber configuration. Do not modify!
grabber:
  interval_s: 5  # Interval for the data acquisition in seconds
