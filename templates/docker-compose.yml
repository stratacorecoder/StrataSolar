name: stratasolar

services:
  stratasolar:
    container_name: stratasolar
    # Build context is the repo root when using:
    #   docker compose -f templates/docker-compose.yml ...
    # If you copy this file to the repo root, use: build: .
    build:
      context: ..
      dockerfile: dockerfile
    image: stratasolar:local
    # After stratacorecoder/stratasolar is published on Docker Hub, switch to:
    # image: stratacorecoder/stratasolar:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8020:5000"
    volumes:
      - /volume1/docker/stratasolar:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # --- RS485 (Sunsynk connection: modbus_rtu) ------------------------------
    # Pass the host USB-RS485 adapter into the container and grant access to it.
    # Prefer the stable /dev/serial/by-id/... symlink over /dev/ttyUSB0, which
    # can renumber across reboots. Map it to whatever serial_port is set in
    # config.yml (e.g. /dev/ttyUSB0).
    #devices:
    #  - "/dev/ttyUSB0:/dev/ttyUSB0"
    #group_add:
    #  - dialout
    # -------------------------------------------------------------------------
